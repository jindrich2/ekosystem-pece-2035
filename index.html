<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Udržitelný ekosystém péče 2035: mapa kritických bariér a rizik neformální péče v Česku a šest designových výzev k roku 2035.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ekosystém péče 2035</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: poster system A (Řádky) on the web — mono meta row, blue band headers, one row per topic: label + headline left, content right */
:root {
  --paper: #f9f9f7;
  --ink: #111318;
  --ink-2: #4a505c;
  --blue: #1f4dff;
  --blue-soft: #7b93ff;
  --blue-wash: #e6eaff;
  --grey: #aab2bf;
  --line: #e1e3e8;
  --axis: #c3c7cf;
  --ink-3: #868c97;
  --blue-light: #9fb3ff;
  --shade: #e9ebef;
  --white: #ffffff;
  --sky: #e4ebff;
  --sky-line: #c5d1f7;
  --card: #fbfbfa;
  --on-blue: #ffffff;
  /* Pillar accents (CARE 2035 design system): accent = fills, accent-ink = text & thin lines, on-accent = text on fills.
     Default = A · Demografie blue; pages set data-pillar on <main>, overview blocks set it per item. */
  --accent: #1f4dff;
  --accent-ink: #1f4dff;
  --accent-light: #9fb3ff;
  --accent-wash: rgba(31, 77, 255, 0.10);
  --on-accent: #ffffff;
  --tint: #e4ebff;
  --tint-line: #c5d1f7;
  --display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --wrap: 1200px;
  --gutter: clamp(16px, 4vw, 48px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1115; --ink: #eef0f4; --ink-2: #a7aebb; --blue: #5b7bff; --blue-soft: #8fa3ff;
    --blue-wash: #1a2140; --grey: #5d6573; --line: #262b34; --axis: #3a414d; --ink-3: #7d8594; --blue-light: #3d53a8; --accent: #5b7bff; --accent-ink: #8fa3ff; --accent-light: #3d53a8; --accent-wash: rgba(91, 123, 255, 0.16); --on-accent: #ffffff; --tint: #121a33; --tint-line: #26345e; --shade: #181b21; --card: #0f1115; --white: #08090b; --sky: #121a33; --sky-line: #26345e; --on-blue: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1115; --ink: #eef0f4; --ink-2: #a7aebb; --blue: #5b7bff; --blue-soft: #8fa3ff;
  --blue-wash: #1a2140; --grey: #5d6573; --line: #262b34; --axis: #3a414d; --ink-3: #7d8594; --blue-light: #3d53a8; --accent: #5b7bff; --accent-ink: #8fa3ff; --accent-light: #3d53a8; --accent-wash: rgba(91, 123, 255, 0.16); --on-accent: #ffffff; --tint: #121a33; --tint-line: #26345e; --shade: #181b21; --card: #0f1115; --white: #08090b; --sky: #121a33; --sky-line: #26345e; --on-blue: #ffffff; color-scheme: dark;
}
/* Pillar themes */
[data-pillar="demografie"] { --accent: #1f4dff; --accent-ink: #1f4dff; --accent-light: #9fb3ff; --accent-wash: rgba(31, 77, 255, 0.10); --on-accent: #ffffff; --tint: #e4ebff; --tint-line: #c5d1f7; }
[data-pillar="pecujici"] { --accent: #db5461; --accent-ink: #b14550; --accent-light: #ecafb4; --accent-wash: rgba(219, 84, 97, 0.12); --on-accent: #0b0b0b; --tint: #fbe8ea; --tint-line: #f0c4c8; }
[data-pillar="finance"] { --accent: #6bd425; --accent-ink: #3b7018; --accent-light: #b9e899; --accent-wash: rgba(107, 212, 37, 0.16); --on-accent: #0b0b0b; --tint: #eaf7df; --tint-line: #c8e9ad; }
[data-pillar="obce"] { --accent: #3ab795; --accent-ink: #27725e; --accent-light: #a3dbcb; --accent-wash: rgba(58, 183, 149, 0.14); --on-accent: #0b0b0b; --tint: #e1f3ed; --tint-line: #b5e0d3; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-pillar="pecujici"] { --accent: #db5461; --accent-ink: #f08a94; --accent-light: #7a3038; --accent-wash: rgba(219, 84, 97, 0.18); --on-accent: #0b0b0b; --tint: #2a1518; --tint-line: #4d262b; }
  :root:not([data-theme="light"]) [data-pillar="finance"] { --accent: #6bd425; --accent-ink: #96e45f; --accent-light: #3b6a1d; --accent-wash: rgba(107, 212, 37, 0.18); --on-accent: #0b0b0b; --tint: #18240f; --tint-line: #2f4a1c; }
  :root:not([data-theme="light"]) [data-pillar="obce"] { --accent: #3ab795; --accent-ink: #6fd6b9; --accent-light: #1f6653; --accent-wash: rgba(58, 183, 149, 0.18); --on-accent: #0b0b0b; --tint: #0f2620; --tint-line: #1d4a3e; }
  :root:not([data-theme="light"]) [data-pillar="demografie"] { --accent: #5b7bff; --accent-ink: #8fa3ff; --accent-light: #3d53a8; --accent-wash: rgba(91, 123, 255, 0.16); --on-accent: #ffffff; --tint: #121a33; --tint-line: #26345e; }
}
:root[data-theme="dark"] [data-pillar="pecujici"] { --accent: #db5461; --accent-ink: #f08a94; --accent-light: #7a3038; --accent-wash: rgba(219, 84, 97, 0.18); --on-accent: #0b0b0b; --tint: #2a1518; --tint-line: #4d262b; }
:root[data-theme="dark"] [data-pillar="finance"] { --accent: #6bd425; --accent-ink: #96e45f; --accent-light: #3b6a1d; --accent-wash: rgba(107, 212, 37, 0.18); --on-accent: #0b0b0b; --tint: #18240f; --tint-line: #2f4a1c; }
:root[data-theme="dark"] [data-pillar="obce"] { --accent: #3ab795; --accent-ink: #6fd6b9; --accent-light: #1f6653; --accent-wash: rgba(58, 183, 149, 0.18); --on-accent: #0b0b0b; --tint: #0f2620; --tint-line: #1d4a3e; }
:root[data-theme="dark"] [data-pillar="demografie"] { --accent: #5b7bff; --accent-ink: #8fa3ff; --accent-light: #3d53a8; --accent-wash: rgba(91, 123, 255, 0.16); --on-accent: #ffffff; --tint: #121a33; --tint-line: #26345e; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.02em; line-height: 1.08; text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--gutter); }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
.brand { text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
.brand b { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--accent-ink); font-weight: 700; font-family: var(--display); font-size: 18px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; font-size: 15px; font-weight: 500; padding: 6px 12px; border-radius: 999px; color: var(--ink-2); }
.nav a:hover { color: var(--ink); background: var(--accent-wash); }
.nav a[aria-current="true"] { color: var(--on-accent); background: var(--accent); }
.meta { padding-block: 22px 0; color: var(--ink-2); }

/* Blue band (poster header) */
.band { background: var(--shade); color: var(--ink); margin-top: 22px; overflow: hidden; }
.band .wrap { padding-block: clamp(28px, 5vw, 56px); display: grid; gap: 10px; }
.band .kicker { font-size: clamp(16px, 1.8vw, 21px); font-weight: 500; color: var(--ink-2); }
.band h1 { font-size: clamp(34px, 5.6vw, 72px); font-weight: 700; }
.band .lede { max-width: 62ch; font-size: clamp(17px, 1.6vw, 20px); color: var(--ink-2); margin-top: 8px; }
.crumb { color: var(--ink-2); text-decoration: none; }
.crumb:hover { color: var(--ink); text-decoration: underline; }

/* Rows */
main { padding-bottom: 72px; }
.row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 64px); padding-block: clamp(28px, 4vw, 48px); border-top: 1px solid var(--ink); }
.row:first-child { border-top: 0; }
.row > * { min-width: 0; }
.row .label { color: var(--ink-2); margin-bottom: 14px; }
.row .row-note { color: var(--ink-2); font-size: 16px; line-height: 1.55; margin-top: 16px; max-width: 42ch; }
.row h2 { font-size: clamp(26px, 3vw, 38px); font-weight: 600; }
.big { font-family: var(--display); font-weight: 700; color: var(--accent-ink); font-size: clamp(56px, 8vw, 104px); line-height: 0.95; letter-spacing: -0.04em; margin-top: 22px; }
.big-cap { color: var(--ink-2); font-size: 15px; margin-top: 8px; max-width: 34ch; }
.prose { display: grid; gap: 14px; max-width: 66ch; }
.prose p { color: var(--ink); }
ul.facts { list-style: none; padding: 0; margin: 0; display: grid; }
ul.facts li { padding-block: 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 10px 1fr; gap: 14px; }
ul.facts li:first-child { border-top: 0; padding-top: 0; }
ul.facts li::before { content: ""; width: 8px; height: 8px; background: var(--accent); margin-top: 9px; }
ul.facts strong { font-weight: 600; }

/* Stat strip */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.stat { padding: 26px 20px 26px 0; display: grid; gap: 8px; align-content: start; }
.stat + .stat { padding-left: 20px; border-left: 1px solid var(--line); }
.stat b { font-family: var(--display); font-size: clamp(34px, 4vw, 52px); letter-spacing: -0.03em; line-height: 1; color: var(--accent-ink); font-weight: 700; }
.stat span { font-size: 15px; color: var(--ink-2); }

/* Index lists (barriers / challenges) */
.index { display: grid; }
.index a { display: grid; grid-template-columns: 56px minmax(0, 1fr) 28px; gap: 16px; align-items: baseline; text-decoration: none; padding-block: 18px; border-top: 1px solid var(--line); }
.index a:first-child { border-top: 0; padding-top: 4px; }
.index .k { font-family: var(--mono); font-size: 13px; color: var(--accent-ink); letter-spacing: 0.06em; }
.index .t { font-size: clamp(19px, 1.9vw, 23px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.index .d { display: block; font-size: 15px; font-weight: 400; color: var(--ink-2); margin-top: 6px; letter-spacing: 0; line-height: 1.5; }
.index .arr { color: var(--grey); font-size: 20px; transition: transform .2s ease, color .2s ease; }
.index a:hover .t { color: var(--accent-ink); }
.index a:hover .arr { color: var(--accent-ink); transform: translateX(4px); }
.index a[data-pillar] { background: var(--tint); padding: 20px clamp(16px, 2vw, 24px); border-top: 0; margin-top: 8px; box-shadow: inset 4px 0 0 var(--accent); transition: box-shadow .2s ease; }
.index a[data-pillar]:first-child { margin-top: 0; padding-top: 20px; }
.index a[data-pillar] .k { color: var(--accent-ink); font-weight: 600; }
.index a[data-pillar] .arr { color: var(--accent-ink); }
.index a[data-pillar]:hover { box-shadow: inset 8px 0 0 var(--accent); }
.index a[data-pillar]:hover .t { color: var(--ink); }

/* Section layout with side nav */
.split { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); padding-top: 36px; }
.navcol { position: sticky; top: 90px; align-self: start; min-width: 0; }
.side { display: grid; gap: 2px; }
.pills { display: none; }
.side .mono { color: var(--ink-2); margin-bottom: 10px; }
.side a { text-decoration: none; font-size: 15px; line-height: 1.35; padding: 9px 12px; border-left: 2px solid var(--line); color: var(--ink-2); display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.side a:hover { color: var(--ink); border-left-color: var(--grey); }
.side a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent-ink); font-weight: 600; }
.side a .k { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); padding-top: 2px; }

/* Challenge */
.hmw { font-family: var(--display); font-size: clamp(24px, 3vw, 38px); font-weight: 600; line-height: 1.18; letter-spacing: -0.02em; text-wrap: pretty; }
.hmw em { font-style: normal; color: var(--accent-ink); }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 14px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-2); text-decoration: none; background: var(--paper); }
a.tag:hover { border-color: var(--accent-ink); color: var(--accent-ink); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--ink); padding-top: 24px; margin-top: 8px; }
.pager a { text-decoration: none; display: grid; gap: 4px; }
.pager a:last-child { text-align: right; }
.pager .mono { color: var(--ink-2); }
.pager b { font-weight: 600; font-size: 17px; line-height: 1.3; }
.pager a:hover b { color: var(--accent-ink); }

/* Bar compare (to scale) */
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; }
.bar-row .y { font-weight: 700; font-size: 17px; }
.bar-track { position: relative; height: 34px; }
.bar { height: 100%; background: var(--grey); display: flex; align-items: center; padding-left: 10px; color: var(--on-accent); font-weight: 600; font-size: 14px; white-space: nowrap; }
.bar.hot { background: var(--accent); }
.bar-note { font-size: 14px; color: var(--ink-2); }

/* Footer */
.foot { margin-top: 24px; }
.foot .wrap { padding-block: 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }

/* Mobile menu */
.menu-btn { display: none; align-items: center; gap: 8px; font: 600 15px/1 var(--body); color: var(--ink); background: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.menu-btn .ico { display: block; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; overflow: visible; }
.menu-btn .ico path { transition: transform .2s ease, opacity .2s ease; transform-origin: 8px 6px; }
.menu-btn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.menu-btn[aria-expanded="true"] .l1 { transform: translateY(5px) rotate(45deg); }
.menu-btn[aria-expanded="true"] .l2 { opacity: 0; }
.menu-btn[aria-expanded="true"] .l3 { transform: translateY(-5px) rotate(-45deg); }
.drawer { border-top: 1px solid var(--line); max-height: calc(100dvh - 64px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; }
.drawer .wrap { padding-block: 8px 28px; display: grid; gap: 22px; }
.drawer h4 { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 6px; }
.drawer a { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; text-decoration: none; padding: 11px 0; border-top: 1px solid var(--line); font-size: 16px; font-weight: 500; line-height: 1.3; }
.drawer a.child { padding-left: 20px; font-size: 15px; font-weight: 400; color: var(--ink-2); }
.drawer a .k { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); padding-top: 3px; }
.drawer a[aria-current="true"] { color: var(--accent-ink); }
.drawer .top-link { font-size: 18px; font-weight: 600; grid-template-columns: minmax(0, 1fr); }

/* Phone chart variants */
.m-only { display: none; }
.mbars { display: grid; gap: 12px; }
.mbar-l { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 4px; }
.mbar-l b { font-weight: 700; white-space: nowrap; }
.mbar-l span { color: var(--ink-2); }
.mbar-l .hot { color: var(--ink); font-weight: 600; }
.mbar-t { height: 14px; display: flex; gap: 2px; }
.mbar-t i { display: block; height: 100%; background: var(--grey); border-radius: 0 3px 3px 0; min-width: 2px; }
.mbar-t i.b { background: var(--accent); border-radius: 0; }
.mbar-t i.b:last-child { border-radius: 0 3px 3px 0; }
.mnote { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.mchart { width: 100%; height: auto; display: block; }

/* Responsive HTML charts in poster style (bars, dots, stacks, unit squares) */
.cnote { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-bottom: 10px; line-height: 1.5; }
.legend i.dot { border-radius: 50%; }
.legend i.lt { background: var(--accent-light); }
.legend i.dash { background: transparent; border: 2px dashed var(--accent-ink); }
.hc { display: grid; gap: 10px; container-type: inline-size; }
.split > div:last-child { container-type: inline-size; min-width: 0; }
@container (max-width: 760px) { .split .row.chart-row { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
@container (max-width: 460px) {
  .hb, .db, .sk { grid-template-columns: minmax(0, 1fr); }
  .hb .l, .db .l, .sk .l { text-align: left; }
  .db .v { grid-column: 1; }
}
.hb, .db, .sk { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.hb .l, .db .l, .sk .l { font-size: 14px; color: var(--ink-2); text-align: right; line-height: 1.3; }
.hb.b .l { color: var(--ink); font-weight: 600; }
.hb .tr { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hb .bar { display: block; flex: none; height: 18px; min-width: 2px; background: var(--grey); border-radius: 0 4px 4px 0; }
.hb.b .bar { background: var(--accent); }
.hb.lt .bar { background: var(--accent-light); }
.hb .v { font-size: 15px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.hb.b .v { color: var(--ink); font-weight: 700; }
.db .tr { position: relative; height: 26px; border-left: 2px solid var(--axis); }
.db .seg { position: absolute; top: 11px; height: 4px; background: var(--grey); border-radius: 2px; }
.db .d { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--grey); border: 2px solid var(--paper); }
.db .d.b { background: var(--accent); }
.db .v { grid-column: 2; font-size: 14px; color: var(--ink-2); }
.db .v b { color: var(--ink); }
.sk .tr { display: flex; gap: 2px; height: 30px; }
.sk .tr span { display: flex; align-items: center; padding-inline: 8px; font-size: 14px; font-weight: 600; background: var(--grey); color: var(--ink); white-space: nowrap; overflow: hidden; min-width: 0; }
.sk .tr span.b { background: var(--accent); color: var(--on-accent); }
.sk .tr span:last-child { border-radius: 0 4px 4px 0; justify-content: flex-end; }
.sk.wide { grid-template-columns: minmax(0, 1fr); }
.sk.wide .tr { height: 48px; }
.ugrid { display: flex; flex-wrap: wrap; gap: 2px; }
.ugrid i { width: var(--u, 8px); height: var(--u, 8px); border-radius: 1.5px; background: var(--grey); }
.ugrid i.b { background: var(--accent); }
.uhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 14px; color: var(--ink-2); margin-bottom: 6px; }
.uhead b { color: var(--ink); font-size: 16px; }
.ublock { display: grid; gap: 4px; padding-block: 12px; border-top: 1px solid var(--line); }
.ublock:first-child { border-top: 0; padding-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 20px 28px; }
.tile { border-top: 6px solid var(--grey); padding-top: 14px; display: grid; gap: 6px; align-content: start; }
.tile.b { border-top-color: var(--accent-ink); }
.tile b { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 48px); letter-spacing: -0.03em; line-height: 1; }
.tile.b b { color: var(--accent-ink); }
.tile span { font-size: 14px; color: var(--ink-2); }

const app = document.getElementById("app");

const chTitle = c => c.title + (c.sub ? " (" + c.sub + ")" : "");

const nb = t => t.replace(/(\d) (?=\d{3}\b)/g, "$1\u00a0").replace(/(\d) (%|Kč|h\b|tis\.|p\. b\.)/g, "$1\u00a0$2");
// Hero: grey band, black type, and the square line from the footer grown into the page's main motif.
// Three rows of squares rise from the bottom edge (sparse → dense) in the colours of the page's pillar(s).
let heroTheme = null, heroSeed = "uvod";
const setHero = (ids, seed) => { heroTheme = ids; heroSeed = seed; };
const SQ_GREY = "#c9ced6";
function squarePalette(ids) {
  const set = ids || Object.keys(PAL);
  const one = set.length === 1;
  return [...set.flatMap(id => one
    ? [[PAL[id].a, 4], [PAL[id].l, 2.2], [PAL[id].d, 1.2]]
    : [[PAL[id].a, 3], [PAL[id].l, 1.2]]), [SQ_GREY, one ? 1.2 : 0.8]];
}
function squares(seed, ids, density = [0.16, 0.42, 0.86], cols = 140) {
  const r = rng(hash("sq:" + seed)), pal = squarePalette(ids);
  return `<div class="sq" aria-hidden="true">${density.map(d =>
    `<div class="sq-r">${Array.from({ length: cols }, () => r() < d ? `<i style="background:${pick(r, pal)}"></i>` : "<i></i>").join("")}</div>`).join("")}</div>`;
}
function band(kicker, title, lede, art = "", cls = "") {
  return `<section class="band ${cls}"><div class="wrap">
    <div class="txt"><div class="kicker">${kicker}</div><h1>${title}</h1>${lede ? `<p class="lede">${nb(lede)}</p>` : ""}</div>
  </div>${squares(heroSeed, heroTheme)}</section>`;
}

// Graphic elements. Seeded so every page always draws the same composition.
const PAL = {
  demografie: { a: "#1f4dff", l: "#9fb3ff", t: "#e4ebff", d: "#0d2a9e" },
  pecujici: { a: "#db5461", l: "#ecafb4", t: "#fbe8ea", d: "#8e2c37" },
  finance: { a: "#6bd425", l: "#b9e899", t: "#eaf7df", d: "#3b7018" },
  obce: { a: "#3ab795", l: "#a3dbcb", t: "#e1f3ed", d: "#1f6653" }
};
const BG = "var(--accent)"; // blocks in the band colour dissolve into the band
const hash = s => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) >>> 0;
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = (r, list) => { let x = r() * list.reduce((s, [, w]) => s + w, 0); for (const [c, w] of list) if ((x -= w) < 0) return c; return list[0][0]; };
const rects = (vw, vh, out) => `<svg viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">${out.map(([x, y, w, h, c]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`).join("")}</svg>`;

// Book-cover mosaic: recursive split of a grid into large and small blocks
function mosaic(seed, colors, C = 16, R = 10) {
  const r = rng(hash(seed)), out = [];
  const leaf = (x, y, w, h) => out.push([x, y, w, h, pick(r, colors)]);
  const split = (x, y, w, h, d) => {
    if (w * h <= 1 || (w * h <= C * R / 7 && r() < 0.4)) return leaf(x, y, w, h);
    const vert = w === 1 ? false : h === 1 ? true : r() < w / (w + h);
    const k = 1 + Math.floor(r() * ((vert ? w : h) - 1));
    if (vert) { split(x, y, k, h, d + 1); split(x + k, y, w - k, h, d + 1); }
    else { split(x, y, w, k, d + 1); split(x, y + k, w, h - k, d + 1); }
  };
  split(0, 0, C, R, 0);
  return rects(C, R, out);
}
const tones = (id, w = 1) => { const p = PAL[id]; return [[p.a, 2 * w], [p.l, 1.4 * w], [p.d, 1.1 * w], [p.t, 0.6 * w]]; };
const pillarMosaic = (id, seed) => { const p = PAL[id]; return mosaic(seed, [[BG, 1.2], [p.l, 2], [p.d, 1.6], [p.t, 1], ["#ffffff", 0.5], ["#111318", 0.25]]); };
const mixMosaic = (ids, seed) => mosaic(seed, [[BG, 1.6], ...ids.flatMap(id => tones(id)), ["#ffffff", 0.5]]);

// Polychrome bars: narrow columns in a few rows, gaps left empty
function poly(seed, ids, cols = 6, rows = 4) {
  const r = rng(hash(seed)), set = ids.flatMap(id => [[PAL[id].a, 3], [PAL[id].l, 1.6], [PAL[id].d, 1.2]]), out = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (r() > 0.22) out.push([x, y, 1, 1, pick(r, set)]);
  return rects(cols, rows, out);
}

// Home: vertical stripes; each lower row is one year 2026–2050, shifted by that year's growth of the 80+ population
function waveStripes() {
  const P = PAL, seq = [P.pecujici.l, P.demografie.t, P.demografie.l, P.obce.a, P.finance.a, P.pecujici.a, P.demografie.d, P.pecujici.a, P.finance.a, P.obce.a, P.demografie.l, P.demografie.t];
  const n = seq.length, cw = 10, W = n * cw, top = 46, rh = 54 / PRIRUSTEK.length, out = [];
  const row = (y, h, s) => { for (let j = -3; j < n + 3; j++) out.push([+(j * cw + s).toFixed(2), +y.toFixed(3), cw, +(h + 0.05).toFixed(3), seq[(j % n + n) % n]]); };
  row(0, top, 0);
  PRIRUSTEK.forEach((v, i) => row(top + i * rh, rh, v / 40 * 18));
  return `<div class="art-cap"><span>2026 ↓ 2050</span><span>posun = přírůstek lidí 80+</span></div>` + rects(W, top + 54, out);
}

function signature() {
  const r = rng(hash("CARE 2035")), ids = Object.keys(PAL), out = [];
  for (let x = 0; x < 72; x++) if (r() > 0.18) out.push([x, 0, 1, 1, pick(r, ids.flatMap(id => [[PAL[id].a, 3], [PAL[id].l, 1]]))]);
  return rects(72, 1, out).replace("<svg", '<svg class="sig"');
}

function side(label, items, current) {
  const link = (i, cls) => `<a href="#${i.href}" class="${cls}" ${i.pillar ? `data-pillar="${i.pillar}"` : ""} ${i.href === current ? 'aria-current="true"' : ""}><span class="k" data-short="${i.short}">${i.k}</span><span class="t">${i.t}</span></a>`;
  const active = items.find(i => i.href === current || (i.children || []).some(c => c.href === current));
  const pill = i => `<a href="#${i.href}" ${i.pillar ? `data-pillar="${i.pillar}"` : ""} ${i.href === current ? 'aria-current="true"' : i === active ? 'class="parent"' : ""}><span class="k">${i.k}</span>${i.short}</a>`;
  const subs = active && active.children && active.children.length ? active.children : null;
  return `<div class="navcol">
    <nav class="side" aria-label="${label}"><div class="mono">${label}</div>${items.map(i =>
      link(i, "") + (i.children || []).map(c => link(c, "child")).join("")).join("")}</nav>
    <div class="pills">
      <nav class="pill-row main" aria-label="${label}">${items.map(pill).join("")}</nav>
      ${subs ? `<div class="pill-sub"><span class="mono">${active.k} · ${active.short}</span>
        <nav class="pill-row" aria-label="Podstránky: ${active.short}">${pill({ href: active.href, k: active.k, short: "Přehled", pillar: active.pillar })}${subs.map(pill).join("")}</nav></div>` : ""}
    </div>
  </div>`;
}
function barrierItems() {
  return BARRIERS.map(x => ({ href: x.id, k: x.k, t: x.title, short: x.short, pillar: x.id,
    children: (x.subs || []).map((s, j) => ({ href: s.id, k: x.k + (j + 1), t: s.t, short: s.short, pillar: x.id })) }));

function pager(prev, next) {

}

function mRust() {
  const W = 340, H = 240, x0 = 30, x1 = 262, top = 16, bot = 206;
  const X = i => x0 + (x1 - x0) * i / 25, Y = v => bot - (v - 80) / 100 * (bot - top);

  for (let v = 80; v <= 180; v += 20) g += `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 100 ? "var(--axis)" : "var(--line)"}"/><text x="${x0 - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}</text>`;
  [0, 10, 25].forEach(i => g += `<text x="${X(i)}" y="${H - 14}" text-anchor="${i === 25 ? "end" : "middle"}" font-size="11" fill="var(--ink-3)">${2025 + i}</text>`);
  return `<svg class="mchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Index počtu osob 80+ (2025 = 100): 159 v roce 2035, 183 v roce 2050; skupiny 65–79 let 114–127">${g}
    ${RUST.grey.map(a => `<path d="${line(a)}" fill="none" stroke="var(--grey)" stroke-width="2" stroke-linejoin="round"/>`).join("")}
    <path d="${line(RUST.y80)}L${X(25)},${bot}L${x0},${bot}Z" fill="var(--accent-wash)"/>
    <path d="${line(RUST.y80)}" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(10)}" cy="${Y(158.5)}" r="4.5" fill="var(--accent)" stroke="var(--paper)" stroke-width="2"/>
    <circle cx="${X(25)}" cy="${Y(182.8)}" r="4.5" fill="var(--accent)" stroke="var(--paper)" stroke-width="2"/>
    <text x="${X(10) - 8}" y="${Y(158.5) - 8}" text-anchor="end" font-size="12" fill="var(--ink-2)">2035: 159</text>
    <text x="${X(25) + 8}" y="${Y(182.8) + 4}" font-size="13" font-weight="700" fill="var(--ink)">183</text>
    <text x="${X(25) + 8}" y="${Y(182.8) + 19}" font-size="11" fill="var(--ink-2)">80+</text>

  </svg>`;
}

function mPrirustek() {
  const W = 340, H = 244, x0 = 40, x1 = 336, top = 50, zero = 184, per = (zero - top) / 40, pitch = (x1 - x0) / 25;
  const X = i => x0 + i * pitch;
  let g = `<rect x="${X(1) - 2}" y="4" width="${pitch * 11 + 2}" height="${zero - 4 + 14}" rx="4" fill="var(--accent-wash)"/>
    <text x="${X(1) + 4}" y="20" font-size="12" font-weight="600" fill="var(--ink)">zlom 2027–2037</text>`;
  [0, 10, 20, 30, 40].forEach(v => g += `<line x1="${x0}" x2="${x1}" y1="${zero - v * per}" y2="${zero - v * per}" stroke="${v ? "var(--line)" : "var(--axis)"}"/><text x="${x0 - 6}" y="${zero - v * per + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v ? v + " tis." : "0"}</text>`);
  PRIRUSTEK.forEach((v, i) => {
    const h = Math.max(Math.abs(v) * per, 1.5), y = v >= 0 ? zero - h : zero;
    g += `<rect x="${X(i) + 1.5}" y="${y}" width="${pitch - 3}" height="${h}" rx="1.5" fill="${i >= 1 && i <= 11 ? "var(--accent)" : "var(--grey)"}"/>`;
  });
  [[1, "2027", "middle"], [11, "2037", "middle"], [19, "2045", "middle"], [24, "2050", "end"]].forEach(([i, t, a]) => g += `<text x="${a === "end" ? x1 : X(i) + pitch / 2}" y="${H - 22}" text-anchor="${a}" font-size="11" fill="var(--ink-3)">${t}</text>`);
  g += `<text x="${X(1) + pitch / 2}" y="${zero - 40 * per - 5}" text-anchor="start" font-size="12" font-weight="700" fill="var(--ink)" dx="-4">+40 tis.</text>`;
  return `<svg class="mchart" viewBox="0 0 ${W} ${H - 10}" role="img" aria-label="Meziroční přírůstek lidí 80+ v letech 2026–2050; v letech 2027–2037 až 40 tisíc ročně">${g}</svg>`;
}

function subPage(b, s) {
  setHero([b.id], s.id);
  const items = barrierItems();
  const flat = [{ href: b.id, t: b.title }, ...b.subs.map(x => ({ href: x.id, t: x.t }))];
  const i = flat.findIndex(x => x.href === s.id);
  const next = flat[i + 1] || (() => { const nb = BARRIERS[BARRIERS.indexOf(b) + 1]; return nb && { href: nb.id, t: nb.title }; })();
  return `
  ${band(`<a class="crumb" href="#bariery">Mapa kritických bariér a rizik</a> · <a class="crumb" href="#${b.id}">${b.k} · ${b.title}</a>`, s.short, b.facts[s.fact].replace(/<\/?strong>/g, ""), pillarMosaic(b.id, s.id))}
  <div class="wrap split">
    ${side("Bariéry a rizika", items, s.id)}
    <div>${(SUBPAGES[s.id] || SUBPAGES_B[s.id] || SUBPAGES_C[s.id] || SUBPAGES_D[s.id])()}${pager(flat[i - 1], next)}</div>
  </div>
  ${casopis(s.id)}
  ${kraje(s.id)}`;
}

const drawer = document.getElementById("drawer"), menuBtn = document.getElementById("menu-btn");
function setMenu(open) {
  menuBtn.setAttribute("aria-expanded", String(open));
  document.getElementById("menu-label").textContent = open ? "Zavřít" : "Menu";
  drawer.hidden = !open;
}
menuBtn.addEventListener("click", () => setMenu(drawer.hidden));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !drawer.hidden) { setMenu(false); menuBtn.focus(); } });
function renderDrawer(current) {
  const a = (href, k, t, cls = "", pl = "") => `<a href="#${href}" class="${cls}" ${pl ? `data-pillar="${pl}"` : ""} ${href === current ? 'aria-current="true"' : ""}><span class="k">${k}</span><span>${t}</span></a>`;
  drawer.innerHTML = `<div class="wrap"><div>
    <a class="top-link" href="#uvod" ${current === "uvod" ? 'aria-current="true"' : ""}>Přehled</a>
    <h4>Výchozí stav</h4>${a("bariery", "—", "Mapa kritických bariér a rizik")}
    ${BARRIERS.map(b => a(b.id, b.k, b.title, "", b.id) + (b.subs || []).map((s, j) => a(s.id, b.k + (j + 1), s.short, "child", b.id)).join("")).join("")}
    <h4>Horizont 2035</h4>${a("vyzvy", "—", "Designové výzvy")}
    ${CHALLENGES.map(c => a("vyzva-" + c.n, "V" + c.n, c.title)).join("")}
  </div></div>`;
}

function render() {
  const h = (location.hash || "#uvod").slice(1);
  let html, sec = "uvod", pillar = "";
  if (h === "bariery") { html = barriersPage(); sec = "bariery"; }
  else if (h === "vyzvy") { html = challengesPage(); sec = "vyzvy"; }
  else if (byId(h)) { html = barrierPage(byId(h)); sec = "bariery"; pillar = h; }
  else if (BARRIERS.some(b => (b.subs || []).some(s => s.id === h))) {
    const b = BARRIERS.find(b => (b.subs || []).some(s => s.id === h));
    html = subPage(b, b.subs.find(s => s.id === h)); sec = "bariery"; pillar = b.id;
  }
  else if (/^vyzva-[1-6]$/.test(h)) { html = challengePage(CHALLENGES[+h.slice(6) - 1]); sec = "vyzvy"; }
  else html = home();
  app.innerHTML = `<main ${pillar ? `data-pillar="${pillar}"` : ""}>${html}</main>`;
  document.querySelectorAll(".nav a").forEach(a => { if (a.dataset.sec === sec) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  renderDrawer(h || "uvod");
  setMenu(false);
  document.querySelectorAll(".pill-row").forEach(row => {
    const act = row.querySelector('[aria-current="true"], .parent');
    if (act && row.scrollWidth > row.clientWidth) row.scrollLeft = act.offsetLeft - row.offsetLeft - 24;
  });
  window.scrollTo(0, 0);
}
document.getElementById("sig").innerHTML = squares("CARE 2035", null, [0.82], 160).replace('class="sq"', 'class="sq sq-foot"');
window.addEventListener("hashchange", render);
render();
